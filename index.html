<style>
  :root{
    --cream:#FBF6ED;
    --card:#FFFFFF;
    --ink:#3B2E22;
    --ink-soft:#8A7A68;
    --brown:#7A5A3A;
    --brown-dark:#5C4229;
    --line:#E9DFCF;
    --home:#5E86A3;
    --home-bg:#E9F1F6;
    --guardian:#D98A4D;
    --guardian-bg:#FBEBDA;
    --accent:#D9723A;
  }
  *{box-sizing:border-box;}
  .dsw{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding:18px 14px 40px;
    max-width:600px;
    margin:0 auto;
    min-height:100%;
  }
  .dsw-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .dsw-header .paw{font-size:26px;}
  .dsw-title{
    font-size:21px;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  .dsw-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 16px 36px;
  }
  .dsw-tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .dsw-tab{
    flex:1;
    text-align:center;
    padding:9px 0;
    border-radius:10px;
    background:var(--card);
    border:1px solid var(--line);
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .dsw-tab.active{
    background:var(--brown);
    color:#fff;
    border-color:var(--brown);
  }
  .dsw-panel{display:none;}
  .dsw-panel.active{display:block;}

  /* --- input panel --- */
  .dsw-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
  }
  .dsw-card-label{
    font-size:13px;
    font-weight:700;
    color:var(--brown-dark);
    margin-bottom:8px;
    display:block;
  }
  .dsw-datebox{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
  }
  .dsw-datebox input[type=date]{
    flex:1;
    padding:9px 10px;
    border-radius:9px;
    border:1px solid var(--line);
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  textarea.dsw-input{
    width:100%;
    min-height:150px;
    border-radius:10px;
    border:1px solid var(--line);
    padding:10px;
    font-size:14px;
    line-height:1.55;
    resize:vertical;
    background:#FFFDF9;
    color:var(--ink);
  }
  .dsw-hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.5;
  }
  .dsw-btn{
    display:block;
    width:100%;
    margin-top:12px;
    padding:12px 0;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
  }
  .dsw-btn:active{opacity:0.85;}
  .dsw-btn.secondary{
    background:#fff;
    color:var(--brown-dark);
    border:1px solid var(--line);
    font-weight:700;
  }

  /* --- timeline --- */
  .dsw-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:40px 10px;
  }
  .dsw-timeline{
    position:relative;
    padding-left:22px;
  }
  .dsw-timeline::before{
    content:"";
    position:absolute;
    left:7px;
    top:6px;
    bottom:6px;
    width:2px;
    background:var(--line);
  }
  .dsw-item{
    position:relative;
    margin-bottom:14px;
  }
  .dsw-dot{
    position:absolute;
    left:-22px;
    top:14px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--home);
    border:3px solid var(--cream);
  }
  .dsw-item.guardian .dsw-dot{background:var(--guardian);}
  .dsw-item.unknown .dsw-dot{background:#BDBDBD;}

  .dsw-itemcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .dsw-item-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .dsw-time{
    font-size:19px;
    font-weight:800;
    color:var(--brown-dark);
    font-variant-numeric:tabular-nums;
  }
  .dsw-name{
    font-size:15.5px;
    font-weight:800;
    margin-left:8px;
  }
  .dsw-breed{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .dsw-toggle{
    display:flex;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .dsw-toggle button{
    border:none;
    padding:6px 10px;
    font-size:12px;
    font-weight:700;
    background:#fff;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .dsw-toggle button.on.home{background:var(--home-bg);color:var(--home);}
  .dsw-toggle button.on.guardian{background:var(--guardian-bg);color:var(--guardian);}

  .dsw-body{
    margin-top:8px;
    font-size:13px;
    color:var(--ink);
    line-height:1.6;
  }
  .dsw-row{
    display:flex;
    gap:6px;
    margin-bottom:3px;
  }
  .dsw-row .k{
    flex-shrink:0;
    color:var(--ink-soft);
    font-weight:700;
    width:44px;
  }
  .dsw-row .v{
    flex:1;
    word-break:keep-all;
  }
  .dsw-note{
    margin-top:6px;
    padding:7px 9px;
    background:#FFF7E8;
    border-radius:8px;
    font-size:12px;
    color:#8A5A1E;
    font-weight:600;
    line-height:1.5;
  }
  .dsw-editrow{
    margin-top:8px;
    display:flex;
    gap:6px;
  }
  .dsw-editrow input{
    flex:1;
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 8px;
    font-size:12.5px;
    background:#FFFDF9;
  }
  .dsw-unmatched{
    font-size:12px;
    color:#B3541E;
    background:#FDEDE2;
    padding:6px 9px;
    border-radius:8px;
    margin-top:6px;
  }
  .dsw-cage-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:2px 7px;
    border-radius:6px;
    background:#F1E9DA;
    color:var(--brown-dark);
    margin-left:6px;
  }

  /* --- database panel --- */
  .dsw-dblist{max-height:none;}
  .dsw-dbitem{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .dsw-dbitem-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .dsw-dbitem-head .nm{font-weight:800;font-size:14px;}
  .dsw-dbitem-head .br{font-size:11.5px;color:var(--ink-soft);margin-left:6px;font-weight:600;}
  .dsw-dbitem-body{
    margin-top:8px;
    display:none;
  }
  .dsw-dbitem-body.open{display:block;}
  .dsw-dbitem-body label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:700;
    margin:6px 0 3px;
  }
  .dsw-dbitem-body input{
    width:100%;
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 8px;
    font-size:12.5px;
    background:#FFFDF9;
  }
  .dsw-addbtn{
    text-align:center;
    padding:10px;
    border:1.5px dashed var(--line);
    border-radius:12px;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:8px;
  }
  .dsw-savedmsg{
    font-size:11px;
    color:#4C8A5E;
    text-align:center;
    margin-top:6px;
    min-height:14px;
  }
</style>

몽구 ㅡ8시15분(보호자)
로아 ㅡ8시30(집)

  </div>

  <div class="dsw-savedmsg" id="dsw-saved"></div>
</div>

    {name:"시로", breed:"비숑", address:"교동마을 쌍용아파트 105동 1003호 (마복로154번길 23)", access:"", note:"", cage:""},
    {name:"짜장", breed:"말티푸", address:"무지개마을광주 504동 502호", access:"", note:"", cage:""},
    {name:"군밤", breed:"웰시코기", address:"경기 용인시 수지구 달맞이로 59 시온빌라트 5204", access:"공동현관: 홈2580 / 집: 980188", note:"종 버튼 사용", cage:""},
    {name:"라온", breed:"말티푸", address:"경기 용인시 수지구 현암로125번길 11 (죽전철스테이트 1가든 1-2라인) 1501호", access:"", note:"1~2라인", cage:""},
    {name:"또또", breed:"말티즈", address:"경기 용인시 수지구 현암로125번길 11 (죽전철스테이트 1가든 1-2라인) 1501호", access:"", note:"1~2라인", cage:""},
    {name:"누룽지", breed:"말티푸", address:"도담마을 아이파크아파트 102동 1103호 (경기 용인시 수지구 대지로 82)", access:"집: 13605*", note:"", cage:""},
    {name:"아이", breed:"믹스", address:"죽전동 1169-2 301호", access:"1층 공동현관: 사랑→열쇠→4258→종 / 집: 8087*", note:"종 버튼 사용", cage:""},
    {name:"모모2", displayName:"모모(아이모모)", breed:"스피츠", address:"죽전동 1169-2 301호", access:"1층 공동현관: 사랑→열쇠→4258→종 / 집: 8087*", note:"종 버튼 사용, 아이와 같은 집", cage:""},
    {name:"몽구", breed:"", address:"포스빌오피스텔 312호", access:"비번: 8892*", note:"A동 엘리베이터", cage:"", guardianSpot:"오리역 7번출구"}
  ];

  let db = [];
  let schedule = []; // current parsed schedule for selected date
  let currentDate = new Date().toISOString().slice(0,10);

  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

  function showSaved(msg){
    const el = $('#dsw-saved');
    el.textContent = msg || '저장됨';
    clearTimeout(showSaved._t);
    showSaved._t = setTimeout(()=>{ el.textContent=''; }, 1500);
  }

  async function loadDB(){
    let stored = null;
    try{
      const res = await window.storage.get('dog-database', false);
      if(res && res.value){
        stored = JSON.parse(res.value);
      }
    }catch(e){}

    if(!stored){
      db = JSON.parse(JSON.stringify(DEFAULT_DB));
      await saveDB();
      return;
    }

    // merge in any default dogs the saved DB is missing (e.g. newly added dogs)
    let changed = false;
    DEFAULT_DB.forEach(def=>{
      if(!stored.find(d=>d.name===def.name)){
        stored.push(JSON.parse(JSON.stringify(def)));
        changed = true;
      }
    });
    db = stored;
    if(changed) await saveDB();
  }

  async function saveDB(){
    try{
      await window.storage.set('dog-database', JSON.stringify(db), false);
    }catch(e){ console.error('DB save failed', e); }
  }

  async function loadSchedule(dateStr){
    try{
      const res = await window.storage.get('schedule:'+dateStr, false);
      if(res && res.value){
        schedule = JSON.parse(res.value);
        return;
      }
    }catch(e){}
    schedule = [];
  }

  async function saveSchedule(){
    try{
      await window.storage.set('schedule:'+currentDate, JSON.stringify(schedule), false);
      showSaved('저장됨 ✓');
    }catch(e){ console.error('schedule save failed', e); }
  }

  function findDog(name){
    if(!name) return null;
    const clean = name.trim();
    let hit = db.find(d => d.name === clean);
    if(hit) return hit;
    hit = db.find(d => (d.displayName||'').includes(clean) || clean.includes(d.name));
    return hit || null;
  }

  // ---------- parsing ----------
  function parseScheduleText(text){
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const entries = [];
    for(const rawLine of lines){
      let line = rawLine
        .replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/, '')
        .replace(/^\d+[\.\)]\s*/, '');

      let type = null;
      const typeMatch = line.match(/\(([^)]*)\)/);
      if(typeMatch){
        if(typeMatch[1].includes('보호자')) type = 'guardian';
        else if(typeMatch[1].includes('집')) type = 'home';
        line = line.replace(typeMatch[0], '');
      }

      let hour=null, min=0;
      const timeMatch = line.match(/(\d{1,2})\s*[시:]\s*(\d{1,2})?\s*분?/);
      if(timeMatch){
        hour = parseInt(timeMatch[1],10);
        min = timeMatch[2] ? parseInt(timeMatch[2],10) : 0;
        line = line.replace(timeMatch[0], '');
      }

      line = line.replace(/[ㅡ\-—‐~]+/g, ' ').trim();
      const name = (line.split(/\s+/)[0] || rawLine).trim();
      if(!name) continue;

      entries.push({
        id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
        rawName: name,
        hour, min, type,
        rawLine
      });
    }
    return entries;
  }

  function buildScheduleFromParsed(parsed){
    return parsed.map(p=>{
      const dog = findDog(p.rawName);
      let type = p.type;
      if(!type){
        type = (dog && dog.address) ? 'home' : 'guardian';
      }
      return {
        id: p.id,
        name: dog ? (dog.displayName || dog.name) : p.rawName,
        matchedKey: dog ? dog.name : null,
        breed: dog ? dog.breed : '',
        address: dog ? dog.address : '',
        access: dog ? dog.access : '',
        note: dog ? dog.note : '',
        cage: dog ? dog.cage : '',
        hour: p.hour,
        min: p.min,
        type: type,
        guardianLocation: (dog && dog.guardianSpot) ? dog.guardianSpot : '',
        matched: !!dog
      };
    }).sort((a,b)=>{
      const av = (a.hour==null) ? 9999 : a.hour*60+a.min;
      const bv = (b.hour==null) ? 9999 : b.hour*60+b.min;
      return av-bv;
    });
  }

  function fmtTime(h,m){
    if(h==null) return '시간 미정';
    const mm = (m||0).toString().padStart(2,'0');
    return h+':'+mm;
  }

  // ---------- render timeline ----------
  function renderTimeline(){
    const wrap = $('#dsw-timeline-wrap');
    if(!schedule.length){
      wrap.innerHTML = '<div class="dsw-empty">아직 정리된 일정이 없어요.<br/>‘일정 입력’ 탭에서 메시지를 붙여넣어 주세요 🐶</div>';
      return;
    }
    let html = '<div class="dsw-timeline">';
    schedule.forEach((it, idx)=>{
      const cls = !it.matched ? 'unknown' : (it.type==='guardian' ? 'guardian':'');
      html += '<div class="dsw-item '+cls+'" data-id="'+it.id+'">';
      html += '<div class="dsw-dot"></div>';
      html += '<div class="dsw-itemcard">';
      html += '<div class="dsw-item-top">';
      html += '<div><span class="dsw-time">'+fmtTime(it.hour,it.min)+'</span><span class="dsw-name">'+(idx+1)+'. '+esc(it.name)+'</span>' + (it.breed?('<div class="dsw-breed">'+esc(it.breed)+'</div>'):'') + '</div>';
      html += '<div class="dsw-toggle">';
      html += '<button data-act="type" data-val="home" class="'+(it.type==='home'?'on home':'')+'">집</button>';
      html += '<button data-act="type" data-val="guardian" class="'+(it.type==='guardian'?'on guardian':'')+'">보호자</button>';
      html += '</div></div>';

      html += '<div class="dsw-body">';
      if(!it.matched){
        html += '<div class="dsw-unmatched">⚠️ 주소록에 없는 이름이에요. 주소록 관리 탭에서 추가하면 다음부터 자동으로 채워져요.</div>';
      }
      if(it.type === 'home'){
        if(it.address) html += '<div class="dsw-row"><span class="k">주소</span><span class="v">'+esc(it.address)+'</span></div>';
        if(it.access) html += '<div class="dsw-row"><span class="k">출입</span><span class="v">'+esc(it.access)+'</span></div>';
      } else {
        html += '<div class="dsw-row"><span class="k">픽업지</span><span class="v"><input class="dsw-guard-input" data-id="'+it.id+'" placeholder="예: 오리역 7번 출구 앞" value="'+esc(it.guardianLocation||'')+'" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12.5px;"/></span></div>';
      }
      if(it.note) html += '<div class="dsw-note">📌 '+esc(it.note)+'</div>';
      html += '<div class="dsw-editrow">';
      html += '<input data-cage-id="'+it.id+'" placeholder="캔넬 크기 (예: 작은 캔넬)" value="'+esc(it.cage||'')+'"/>';
      html += '</div>';
      html += '</div>'; // body
      html += '</div></div>';
    });
    html += '</div>';
    wrap.innerHTML = html;

    $$('.dsw-toggle button', wrap).forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const item = e.target.closest('.dsw-item');
        const id = item.getAttribute('data-id');
        const val = e.target.getAttribute('data-val');
        const entry = schedule.find(s=>s.id===id);
        if(entry){ entry.type = val; renderTimeline(); await saveSchedule(); }
      });
    });
    $$('.dsw-guard-input', wrap).forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const entry = schedule.find(s=>s.id===e.target.getAttribute('data-id'));
        if(entry){ entry.guardianLocation = e.target.value; await saveSchedule(); }
      });
    });
    $$('[data-cage-id]', wrap).forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const id = e.target.getAttribute('data-cage-id');
        const entry = schedule.find(s=>s.id===id);
        if(entry){
          entry.cage = e.target.value;
          if(entry.matchedKey){
            const dog = db.find(d=>d.name===entry.matchedKey);
            if(dog){ dog.cage = e.target.value; await saveDB(); }
          }
          await saveSchedule();
        }
      });
    });
  }

  function esc(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- render DB panel ----------
  function renderDB(){
    const list = $('#dsw-dblist');
    list.innerHTML = db.map((d, i)=>{
      return '<div class="dsw-dbitem" data-idx="'+i+'">'
        + '<div class="dsw-dbitem-head"><div><span class="nm">'+esc(d.displayName||d.name)+'</span><span class="br">'+esc(d.breed||'')+'</span></div><span style="color:var(--ink-soft);font-size:12px;">▾</span></div>'
        + '<div class="dsw-dbitem-body">'
          + '<label>이름</label><input data-f="name" value="'+esc(d.name)+'"/>'
          + '<label>견종</label><input data-f="breed" value="'+esc(d.breed||'')+'"/>'
          + '<label>주소</label><input data-f="address" value="'+esc(d.address||'')+'"/>'
          + '<label>출입 정보</label><input data-f="access" value="'+esc(d.access||'')+'"/>'
          + '<label>비고</label><input data-f="note" value="'+esc(d.note||'')+'"/>'
          + '<label>캔넬 크기</label><input data-f="cage" value="'+esc(d.cage||'')+'"/>'
          + '<label>보호자 픽업 장소</label><input data-f="guardianSpot" value="'+esc(d.guardianSpot||'')+'"/>'
        + '</div>'
      + '</div>';
    }).join('');

    $$('.dsw-dbitem-head', list).forEach(head=>{
      head.addEventListener('click', ()=>{
        const body = head.nextElementSibling;
        body.classList.toggle('open');
      });
    });
    $$('.dsw-dbitem', list).forEach(item=>{
      const idx = parseInt(item.getAttribute('data-idx'),10);
      $$('input', item).forEach(inp=>{
        inp.addEventListener('change', async (e)=>{
          const f = e.target.getAttribute('data-f');
          db[idx][f] = e.target.value;
          await saveDB();
          renderDB();
          // reopen the edited one
          const heads = $$('.dsw-dbitem-head', list);
          if(heads[idx]) heads[idx].nextElementSibling.classList.add('open');
        });
      });
    });
  }

  function addNewDog(){
    db.push({name:'새강아지', breed:'', address:'', access:'', note:'', cage:''});
    saveDB();
    renderDB();
    const heads = $$('.dsw-dbitem-head', $('#dsw-dblist'));
    const last = heads[heads.length-1];
    if(last){ last.nextElementSibling.classList.add('open'); last.scrollIntoView({behavior:'smooth', block:'center'}); }
  }

  // ---------- tabs ----------
  function switchTab(name){
    $$('.dsw-tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-tab')===name));
    $$('.dsw-panel').forEach(p=>p.classList.remove('active'));
    $('#panel-'+name).classList.add('active');
  }

  // ---------- init ----------
  async function init(){
    $('#dsw-date').value = currentDate;
    await loadDB();
    await loadSchedule(currentDate);
    renderDB();
    renderTimeline();

    $$('.dsw-tab').forEach(t=>{
      t.addEventListener('click', ()=> switchTab(t.getAttribute('data-tab')));
    });

    $('#dsw-add-dog').addEventListener('click', addNewDog);

    $('#dsw-date').addEventListener('change', async (e)=>{
      currentDate = e.target.value;
      await loadSchedule(currentDate);
      renderTimeline();
    });

    $('#dsw-parse-btn').addEventListener('click', async ()=>{
      const text = $('#dsw-raw').value;
      if(!text.trim()) return;
      const parsed = parseScheduleText(text);
      const newEntries = buildScheduleFromParsed(parsed);
      schedule = newEntries;
      await saveSchedule();
      renderTimeline();
      switchTab('timeline');
    });
  }

  init();
})();
</script>
